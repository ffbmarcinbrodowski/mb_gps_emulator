<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GPS Emulator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header d-flex align-items-center flex-wrap gap-2 px-3 py-2">
  <h1 class="h5 mb-0 me-auto text-secondary fw-normal">Emulator</h1>
  <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#serversModal">
    <i class="bi bi-hdd-network"></i> Servers
  </button>
  <button class="btn btn-sm btn-success" id="btnStartAll"><i class="bi bi-play-fill"></i> Start all</button>
  <button class="btn btn-sm btn-danger" id="btnStopAll"><i class="bi bi-stop-fill"></i> Stop all</button>
</header>

<!-- ===== Main: device list + map ===== -->
<main class="container-fluid px-3 pb-3">
  <div class="row g-3">
    <!-- Device list (left on desktop, below the map on phones) -->
    <section class="col-lg-4 col-xl-3 order-2 order-lg-1">
      <div class="panel-header d-flex align-items-center">
        <span class="me-auto">Devices</span>
        <button class="icon-btn" id="btnAddDevice" title="Add device"><i class="bi bi-plus-lg"></i></button>
        <button class="icon-btn" id="btnEditDevice" title="Edit selected device"><i class="bi bi-pencil"></i></button>
        <button class="icon-btn" id="btnDeleteDevice" title="Delete selected device"><i class="bi bi-trash"></i></button>
      </div>
      <div id="deviceList" class="device-list"></div>
    </section>

    <!-- Map -->
    <section class="col-lg-8 col-xl-9 order-1 order-lg-2">
      <div class="panel-header d-flex align-items-center flex-wrap gap-2">
        <span class="me-auto text-truncate" id="mapTitle">Device: –</span>
        <span id="mapInfo" class="small opacity-75"></span>
        <!-- Send an event (crash, towing, ...) from the selected running device -->
        <div class="dropdown">
          <button class="btn btn-sm btn-light dropdown-toggle" id="btnEvent" data-bs-toggle="dropdown"
                  aria-expanded="false" disabled title="Start the device to send events">
            <i class="bi bi-lightning-charge"></i> Event
          </button>
          <ul class="dropdown-menu dropdown-menu-end event-menu" id="eventMenu"></ul>
        </div>
      </div>
      <div id="mainMap" class="map main-map"></div>
    </section>
  </div>
</main>

<!-- ===== Add / edit device modal ===== -->
<div class="modal fade" id="deviceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-fullscreen-lg-down">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5 text-secondary" id="deviceModalTitle">New device</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <form id="deviceForm" class="col-lg-4" novalidate autocomplete="off">
            <div class="form-row-label">
              <label for="fName">Name</label>
              <input class="form-control form-control-sm" id="fName" required>
            </div>
            <div class="form-row-label">
              <label for="fImei">IMEI</label>
              <input class="form-control form-control-sm" id="fImei" inputmode="numeric" maxlength="20" required>
            </div>

            <h3 class="h6 text-secondary mt-4 mb-2">Route</h3>
            <div class="form-row-label">
              <label for="fStart"><span class="dot dot-start"></span>Start</label>
              <input class="form-control form-control-sm" id="fStart" placeholder="click on the map" required>
            </div>
            <div class="form-row-label">
              <label for="fEnd"><span class="dot dot-end"></span>End</label>
              <input class="form-control form-control-sm" id="fEnd" placeholder="click on the map" required>
            </div>
            <div class="small text-secondary mb-2 ms-1" id="routeInfo">Click the map to set the start, then the end point.</div>
            <div class="form-row-label">
              <label for="fInterval">Interval</label>
              <div class="input-group input-group-sm">
                <input type="number" class="form-control" id="fInterval" min="1" max="3600" required>
                <span class="input-group-text">s</span>
              </div>
            </div>
            <div class="form-row-label">
              <label for="fSpeed">Speed</label>
              <div class="input-group input-group-sm">
                <input type="number" class="form-control" id="fSpeed" min="1" max="300" required>
                <span class="input-group-text">km/h</span>
              </div>
            </div>

            <h3 class="h6 text-secondary mt-4 mb-2">Server</h3>
            <select class="form-select form-select-sm mb-2" id="fServer" required></select>
            <div class="form-row-label">
              <label>Address</label>
              <input class="form-control form-control-sm" id="fServerHost" readonly>
            </div>
            <div class="form-row-label">
              <label>Port</label>
              <input class="form-control form-control-sm" id="fServerPort" readonly>
            </div>
            <div id="deviceFormError" class="alert alert-danger py-2 small d-none mt-3"></div>
          </form>

          <div class="col-lg-8">
            <div id="formMap" class="map form-map"></div>
            <button class="btn btn-sm btn-link px-0 mt-1" type="button" id="btnResetPoints">
              <i class="bi bi-arrow-counterclockwise"></i> Reset points
            </button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-outline-primary" id="btnSaveNew">Save and new</button>
        <button type="button" class="btn btn-primary" id="btnSave">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Servers modal ===== -->
<div class="modal fade" id="serversModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5 text-secondary">Servers</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr><th>Name</th><th>Host</th><th>Port</th><th></th></tr></thead>
            <tbody id="serverTable"></tbody>
          </table>
        </div>

        <form id="serverForm" class="row g-2 align-items-end" novalidate autocomplete="off">
          <input type="hidden" id="sId">
          <div class="col-sm-4">
            <label class="form-label small mb-1" for="sName">Name</label>
            <input class="form-control form-control-sm" id="sName" required>
          </div>
          <div class="col-sm-4">
            <label class="form-label small mb-1" for="sHost">Host</label>
            <input class="form-control form-control-sm" id="sHost" placeholder="demo.traccar.org" required>
          </div>
          <div class="col-6 col-sm-2">
            <label class="form-label small mb-1" for="sPort">Port</label>
            <input type="number" class="form-control form-control-sm" id="sPort" placeholder="5027" min="1" max="65535" required>
          </div>
          <div class="col-6 col-sm-2 d-flex gap-1">
            <button class="btn btn-sm btn-primary flex-fill" type="submit" id="btnServerSave">Add</button>
            <button class="btn btn-sm btn-outline-secondary d-none" type="button" id="btnServerCancel" title="Cancel edit">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </form>
        <p class="small text-secondary mt-3 mb-0">
          Traccar listens for Teltonika devices on port <strong>5027</strong> by default.
          Each device's IMEI must also be added as a device in Traccar.
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Toast messages -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
