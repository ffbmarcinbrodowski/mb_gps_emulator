<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .device-marker { background: none; border: 0; }
    .device-marker svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }
    .leaflet-tooltip.device-label { font-weight: 600; padding: 1px 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
